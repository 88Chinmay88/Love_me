<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Do You Love Me?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Comic Sans MS', cursive;
      background-color: #ffe6e6;
      text-align: center;
      padding-top: 60px;
      margin: 0;
      overflow: hidden;
      height: 100vh;
    }

    h1 {
      color: #d6336c;
      font-size: 28px;
      margin: 20px;
    }

    #buttons {
      margin-top: 40px;
      position: relative;
      width: 100%;
      height: 60vh;
      touch-action: none;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      transition: 0.1s ease;
    }

    #yesBtn {
      background-color: #28a745;
      color: white;
      z-index: 2;
    }

    #noBtn {
      background-color: #dc3545;
      color: white;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
  </style>
</head>
<body>

  <h1>Do you love me? 💖</h1>

  <div id="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const buttonsContainer = document.getElementById('buttons');

    let pointerX = 0;
    let pointerY = 0;

    function updatePointerPos(e) {
      if (e.touches) {
        pointerX = e.touches[0].clientX;
        pointerY = e.touches[0].clientY;
      } else {
        pointerX = e.clientX;
        pointerY = e.clientY;
      }
    }

    document.addEventListener('mousemove', updatePointerPos);
    document.addEventListener('touchmove', updatePointerPos);

    function moveNoButtonFast() {
      const btnRect = noBtn.getBoundingClientRect();
      const btnX = btnRect.left + btnRect.width / 2;
      const btnY = btnRect.top + btnRect.height / 2;

      const dx = pointerX - btnX;
      const dy = pointerY - btnY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      const moveDistance = 70; // super fast
      if (distance < 150) {
        const angle = Math.atan2(dy, dx);
        const offsetX = -Math.cos(angle) * moveDistance;
        const offsetY = -Math.sin(angle) * moveDistance;

        let newLeft = noBtn.offsetLeft + offsetX;
        let newTop = noBtn.offsetTop + offsetY;

        const containerRect = buttonsContainer.getBoundingClientRect();
        const maxLeft = containerRect.width - noBtn.offsetWidth;
        const maxTop = containerRect.height - noBtn.offsetHeight;

        newLeft = Math.max(0, Math.min(maxLeft, newLeft));
        newTop = Math.max(0, Math.min(maxTop, newTop));

        noBtn.style.left = `${newLeft}px`;
        noBtn.style.top = `${newTop}px`;
      }

      requestAnimationFrame(moveNoButtonFast);
    }

    moveNoButtonFast();

    yesBtn.addEventListener('click', () => {
      alert("YAY! I love you too 💘");
    });
  </script>

</body>
</html>
